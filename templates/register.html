<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SwiftPitch - Create Account</title>
    <style>
        body { background-color: #0b1118; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-box { background-color: #121b26; padding: 30px; border-radius: 8px; border: 1px solid #1c2a39; width: 340px; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #0b1118; border: 1px solid #1c2a39; color: white; box-sizing: border-box; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #00ccff; color: #0b1118; font-weight: bold; border: none; cursor: pointer; text-transform: uppercase; border-radius: 4px; margin-top: 5px; }
        .err { color: #ff3333; font-size: 13px; text-align: center; font-weight: bold; }
        .bonus-badge { background: rgba(255, 204, 0, 0.1); border: 1px dashed #ffcc00; color: #ffcc00; padding: 8px; text-align: center; font-size: 12px; border-radius: 4px; margin-bottom: 15px; font-weight: bold; }
        .nav-link { text-align: center; margin-top: 15px; font-size: 13px; }
        .nav-link a { color: #00ff66; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="register-box">
    <h2 style="margin-top:0; text-align:center; color:#00ccff; letter-spacing: 0.5px;">CREATE ACCOUNT</h2>
    
    <div class="bonus-badge">
        🎁 Free 100 KSH Registration Bonus Included!
    </div>

    {% if error %}<p class="err">⚠️ {{ error }}</p>{% endif %}
    
    <form method="POST" action="/register">
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="phone" name="phone" placeholder="Phone Number (e.g. 07XXXXXXXX)" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Register Account</button>
    </form>
    
    <div class="nav-link">
        Already registered? <a href="/login">Log In Here</a>
    </div>
</div>
</body>
</html>
