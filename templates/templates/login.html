<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftPitch - Login / Register</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0c131c; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .auth-container { background-color: #16222f; padding: 30px; border-radius: 8px; border: 1px solid #223245; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { text-align: center; color: #ffcc00; margin-bottom: 20px; font-size: 28px; letter-spacing: 1px; }
        h2 { color: #ffcc00; font-size: 20px; border-bottom: 1px solid #223245; padding-bottom: 5px; margin-top: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #a0aec0; }
        input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #223245; background-color: #0c131c; color: white; box-sizing: border-box; }
        input:focus { border-color: #ffcc00; outline: none; }
        .btn { background-color: #ffcc00; color: black; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background-color: #e6b800; }
        .alert { background-color: rgba(255, 204, 0, 0.1); border: 1px solid #ffcc00; color: #ffcc00; padding: 10px; border-radius: 5px; margin-bottom: 20px; font-size: 14px; text-align: center; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h1>SWIFTPITCH</h1>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <h2>Sign In</h2>
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" name="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Login</button>
        </form>

        <h2>Create Account</h2>
        <form action="/register" method="POST">
            <div class="form-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" name="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="reg-phone">Phone Number (M-Pesa)</label>
                <input type="tel" id="reg-phone" name="phone" placeholder="e.g. 0712345678">
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <input type="password" id="reg-password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn" style="background-color: #00ff66;">Register & Claim 100 KSH</button>
        </form>

    </div>

</body>
</html>
