<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SwiftPitch - Gateway</title>
    <style>
        body { background-color: #0b1118; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background-color: #121b26; padding: 30px; border-radius: 8px; border: 1px solid #1c2a39; width: 320px; }
        input { width: 100%; padding: 10px; margin: 10px 0; background: #0b1118; border: 1px solid #1c2a39; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #00ff66; color: #0b1118; font-weight: bold; border: none; cursor: pointer; }
        .err { color: #ff3333; font-size: 14px; text-align: center; }
        .hint { font-size: 11px; color: #88a0b0; margin-top: 15px; text-align: center; line-height: 1.4; }
    </style>
</head>
<body>
<div class="login-box">
    <h2 style="margin-top:0; text-align:center; color:#00ff66;">SwiftPitch Log In</h2>
    {% if error %}<p class="err">{{ error }}</p>{% endif %}
    <form method="POST">
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">ENTER SYSTEM</button>
    </form>
    <div class="hint">
        <strong>Demo Accounts Available:</strong><br>
        Admin: admin@swiftpitch.com / adminpassword<br>
        User: player@swiftpitch.com / password123
    </div>
</div>
</body>
</html>
