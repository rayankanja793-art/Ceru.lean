<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftPitch - Sign In</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0c131c; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .login-container { background-color: #16222f; padding: 30px; border-radius: 8px; border: 1px solid #223245; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #ffcc00; text-align: center; margin-top: 0; margin-bottom: 5px; font-size: 32px; letter-spacing: 1px; }
        .subtitle { text-align: center; color: #a0aec0; font-size: 14px; margin-bottom: 25px; }
        h2 { color: #fff; font-size: 18px; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #223245; padding-bottom: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #a0aec0; font-size: 14px; }
        input[type="email"], input[type="password"] { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #223245; background-color: #0c131c; color: white; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #ffcc00; outline: none; }
        .btn { background-color: #ffcc00; color: black; border: none; padding: 12px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; font-size: 15px; margin-top: 5px; }
        .btn:hover { background-color: #e6b800; }
        .alert { background-color: rgba(255, 51, 51, 0.15); border: 1px solid #ff3333; color: #ff3333; padding: 12px; border-radius: 5px; margin-bottom: 20px; font-size: 14px; text-align: center; }
        .divider { border: 0; border-top: 1px solid #223245; margin: 25px 0; }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>SWIFTPITCH</h1>
        <div class="subtitle">Virtual Football Betting Platform</div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="alert">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="/login" method="POST">
            <h2>Sign In</h2>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Login</button>
        </form>

        <div class="divider"></div>

        <form action="/register" method="POST">
            <h2>Create New Account</h2>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="newaccount@mail.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Choose a secure password" required>
            </div>
            <button type="submit" class="btn" style="background-color: transparent; border: 2px solid #ffcc00; color: #ffcc00;">Register & Claim 100 KSH Bonus</button>
        </form>
    </div>

</body>
</html>
