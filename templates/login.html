<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftPitch - Login & Registration</title>
    <style>
        body {
            background-color: #0b1118;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: #121b26;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            border: 1px solid #1c2a39;
            text-align: center;
        }
        h2 {
            margin-bottom: 10px;
            color: #00ff66;
            letter-spacing: 1px;
        }
        p.subtitle {
            color: #88a0b0;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #88a0b0;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #1c2a39;
            background-color: #0b1118;
            color: #ffffff;
            box-sizing: border-box;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #00ff66;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background-color: #00ff66;
            color: #0b1118;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #00cc55;
        }
        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: left;
        }
        .alert-success {
            background-color: rgba(0, 255, 102, 0.1);
            border: 1px solid #00ff66;
            color: #00ff66;
        }
        .alert-danger {
            background-color: rgba(255, 51, 51, 0.1);
            border: 1px solid #ff3333;
            color: #ff3333;
        }
        .info-note {
            font-size: 12px;
            color: #88a0b0;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>SWIFTPITCH</h2>
    <p class="subtitle">Sports Betting & Simulation Platform</p>

    {% if message %}
        <div class="alert alert-success">
            {{ message }}
        </div>
    {% endif %}

    {% if error %}
        <div class="alert alert-danger">
            {{ error }}
        </div>
    {% endif %}

    <form action="/login" method="POST">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <div class="form-group">
            <label for="phone">Phone Number <span style="color: #88a0b0; font-size: 11px;">(Required for registration only)</span></label>
            <input type="text" id="phone" name="phone" placeholder="e.g., 0712345678">
        </div>

        <button type="submit" class="btn">Sign In / Register</button>
    </form>

    <p class="info-note">
        💡 <strong>New Users:</strong> Simply enter your email, password, and phone number to create an account and automatically claim your 100 KSH bonus!
    </p>
</div>

</body>
</html>
