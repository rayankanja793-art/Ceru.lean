<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftPitch - Virtual Gaming Dashboard</title>
    <style>
        body { 
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; 
            background-color: #0b1118; 
            color: #f5f7fa; 
            margin: 0; 
            padding: 15px; 
        }
        .navbar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background-color: #121b26; 
            padding: 12px 20px; 
            border-radius: 8px; 
            border-bottom: 3px solid #ffcc00; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
        }
        .logo { 
            font-size: 22px; 
            font-weight: bold; 
            color: #ffcc00; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }
        .main-layout { 
            display: grid; 
            grid-template-columns: 1fr 340px; 
            gap: 20px; 
        }
        .card { 
            background-color: #121b26; 
            border-radius: 8px; 
            padding: 18px; 
            border: 1px solid #1c2a39; 
            margin-bottom: 15px; 
        }
        
        /* NAVIGATION TABS SYSTEMS */
        .lane-tabs { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 15px; 
        }
        .lane-btn { 
            background: #1c2a39; 
            border: 2px solid #1c2a39; 
            color: #a0aec0; 
            padding: 12px 20px; 
            font-weight: bold; 
            border-radius: 6px; 
            cursor: pointer; 
            flex: 1; 
            text-transform: uppercase; 
            font-size: 13px;
            transition: all 0.2s ease;
        }
        .lane-btn.active-lane { 
            border-color: #ffcc00; 
            color: #ffcc00; 
            background: #121b26; 
        }
        .lane-btn.aviator-lane-btn { 
            border-color: #ff3333; 
            color: #ff3333; 
        }
        .lane-btn.aviator-lane-btn.active-lane { 
            background: #1a0f11; 
            border-color: #ff3333; 
            color: #ff3333; 
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.25); 
        }

        /* LUCKY AVIATOR MULTIPLIER CORE COMPONENTS */
        #aviator-arena { 
            display: none; 
            background: #121b26; 
            border: 2px solid #ff3333; 
            border-radius: 8px; 
            padding: 20px; 
            text-align: center; 
            margin-bottom: 25px; 
            box-shadow: 0 4px 20px rgba(255, 51, 51, 0.1);
        }
        .aviator-canvas-wrapper { 
            position: relative; 
            background: #070b10; 
            border-radius: 6px; 
            overflow: hidden; 
            margin-bottom: 15px; 
            border: 1px solid #1c2a39; 
        }
