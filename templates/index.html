<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftPitch Dashboard</title>
    <style>
        body { background: #0b1118; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        .nav { display: flex; justify-content: space-between; background: #121b26; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
        .card { background: #121b26; padding: 20px; border-radius: 8px; border: 1px solid #1c2a39; }
        .aviator-box { text-align: center; border: 2px solid #ffcc00; }
        .multiplier { font-size: 48px; font-weight: bold; color: #ffcc00; margin: 20px 0; }
        input, button { padding: 10px; border-radius: 4px; border: none; margin: 5px; }
        button { cursor: pointer; font-weight: bold; background: #00ff66; }
        .error { color: #ff3333; }
    </style>
</head>
<body>

<div class="nav">
    <div><strong>SWIFTPITCH</strong> | Wallet: <span id="user-balance">0</span> KSH</div>
    <div>House Balance: <span id="house-balance">0</span> KSH | <a href="/logout" style="color:red;">Logout</a></div>
</div>

<div class="grid">
    <div>
        <div class="card aviator-box">
            <h2>✈️ Lucky Aviator</h2>
            <div class="multiplier" id="mult-display">1.00x</div>
            <div id="status-display">Waiting...</div>
            <br>
            <input type="number" id="bet-amount" placeholder="Stake Amount" value="100">
            <button onclick="placeBet()" id="bet-btn">PLACE BET</button>
            <button onclick="cashOut()" id="cashout-btn" style="background:red; display:none;">CASH OUT</button>
        </div>
        
        <div class="card" style="margin-top:20px;">
            <h3>⚽ Live Matches</h3>
            <div id="matches-list">Loading matches...</div>
        </div>
    </div>

    <div>
        <div class="card">
            <h3>💳 Account</h3>
            <form action="/deposit" method="POST">
                <input type="number" name="amount" placeholder="Amount" required>
                <button type="submit" style="background:#00ccff;">DEPOSIT</button>
            </form>
        </div>
    </div>
</div>

<script>
    // 1. Polling Function (Updates Data every 500ms)
    setInterval(() => {
        fetch('/api/state')
        .then(response => response.json())
        .then(data => {
            document.getElementById('user-balance').innerText = data.user_balance.toFixed(2);
            document.getElementById('house-balance').innerText = data.house_balance.toFixed(2);
            
            const aviator = data.aviator;
            document.getElementById('mult-display').innerText = aviator.multiplier.toFixed(2) + 'x';
            document.getElementById('status-display').innerText = aviator.phase;

            if(aviator.phase === 'FLYING') {
                document.getElementById('bet-btn').style.display = 'none';
                document.getElementById('cashout-btn').style.display = 'inline-block';
            } else {
                document.getElementById('bet-btn').style.display = 'inline-block';
                document.getElementById('cashout-btn').style.display = 'none';
            }
        });
    }, 500);

    // 2. Betting Actions
    function placeBet() {
        const stake = document.getElementById('bet-amount').value;
        fetch('/api/aviator/bet', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({stake: stake})
        }).then(r => r.json()).then(d => {
            if(d.success) alert("Bet Placed!");
            else alert("Balance too low or Game not in Betting phase.");
        });
    }

    function cashOut() {
        fetch('/api/aviator/cashout', { method: 'POST' })
        .then(r => r.json()).then(d => {
            if(d.success) alert("Cashed out: " + d.winnings);
            else alert("Cashout failed.");
        });
    }
</script>
</body>
</html>
