<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwiftPitch - Player Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0c131c; color: white; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00ff66; padding-bottom: 15px; margin-bottom: 20px; }
        .wallet-box { background: #16222f; padding: 10px 20px; border-radius: 8px; border: 1px solid #00ff66; }
        .wallet-amount { font-size: 24px; font-weight: bold; color: #00ff66; }
        .grid-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .card { background-color: #16222f; padding: 20px; border-radius: 8px; border: 1px solid #223245; margin-bottom: 20px; }
        .timer-box { font-size: 32px; font-weight: bold; text-align: center; color: #ffcc00; margin-bottom: 10px; }
        .phase-indicator { text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 20px; letter-spacing: 2px; }
        
        /* Fixtures & Betting */
        .fixture-row { display: flex; justify-content: space-between; align-items: center; background: #0c131c; padding: 15px; margin-bottom: 10px; border-radius: 5px; border-left: 3px solid #ffcc00; }
        .teams { font-weight: bold; font-size: 16px; flex-grow: 1; }
        .score { font-size: 20px; font-weight: bold; color: #00ff66; margin: 0 20px; }
        .odds-buttons { display: flex; gap: 10px; }
        .odd-btn { background: #223245; color: white; border: 1px solid #3b4d63; padding: 8px 15px; border-radius: 4px; cursor: pointer; transition: 0.2s; min-width: 60px; text-align: center; }
        .odd-btn:hover { background: #3b4d63; }
        .odd-btn.selected { background: #ffcc00; color: black; border-color: #ffcc00; font-weight: bold; }
        .odd-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Betslip */
        .betslip-card { border-color: #ffcc00; position: sticky; top: 20px; }
        .betslip-item { background: #0c131c; padding: 10px; margin-bottom: 10px; border-radius: 4px; font-size: 14px; display: flex; justify-content: space-between; }
