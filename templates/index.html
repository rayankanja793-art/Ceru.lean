<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SwiftPitch - League Dashboard</title>
    <style>
        body { background-color: #0b1118; color: #ffffff; font-family: 'Segoe UI', sans-serif; padding: 20px; margin: 0; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background: #121b26; padding: 15px 25px; border-radius: 8px; border: 1px solid #1c2a39; margin-bottom: 20px; }
        .logo { font-size: 20px; font-weight: bold; color: #00ff66; }
        .wallet-panel { display: flex; gap: 20px; align-items: center; font-size: 15px; }
        .highlight { color: #00ff66; font-weight: bold; }
        .vault-box { display: none; background: rgba(255, 204, 0, 0.1); border: 1px solid #ffcc00; padding: 4px 10px; border-radius: 4px; color: #ffcc00; }
        
        .layout-grid { display: grid; grid-template-columns: 400px 1fr 300px; gap: 20px; }
        @media (max-width: 1100px) { .layout-grid { grid-template-columns: 1fr; } }
        
        .card { background: #121b26; border-radius: 8px; padding: 20px; border: 1px solid #1c2a39; margin-bottom: 20px; }
        h3 { margin-top: 0; border-bottom: 1px solid #1c2a39; padding-bottom: 8px; color: #88a0b0; font-size: 13px; text-transform: uppercase; }
        
        .scroll-window { max-height: 400px; overflow-y: auto; }
        .match-row { display: flex; justify-content: space-between; align-items: center; background: #0b1118; padding: 10px; border-radius: 5px; margin-bottom: 8px; border: 1px solid #1c2a39; }
        .score-badge { background: #1c2a39; padding: 3px 8px; border-radius: 4px; color: #00ff66; font-family: monospace; font-weight: bold; }
        
        .aviator-box { text-align: center; border: 2px solid #ff3333; background: linear-gradient(180deg, #121b26 0%, #221111 100%); }
        .mult-display { font-size: 50px; font-weight: bold; color: #ff3333; margin: 10px 0; font-family: monospace; }
        
        input[type="number"] { width: 100%; padding: 10px; background: #0b1118; border: 1px solid #1c2a39; color: white; margin-bottom: 10px; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-bottom: 8px; }
        .btn-green { background: #00ff66; color: #0b1118; }
        .btn-orange { background: #ff9900; color: white; }
        .btn-blue { background: #00ccff; color: #0b1118; }
        
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { padding: 6px; text-align: left; border-bottom: 1px solid #1c2a39; }
        
        .admin-deck { border: 2px dashed #ff3333; background: rgba(255,51,51,0.05); display: none; margin-bottom: 20px; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>

<div class="navbar">
    <div class="logo">SWIFTPITCH SCORECENTER</div>
    <div class="wallet-panel">
        <div class="vault-box" id="admin-vault-display">🛡️ Vault: <span id="house-bal">0.00</span> KSH</div>
        <div>Wallet: <span class="highlight" id="user-bal">0.00</span> KSH <span id="bonus-box"></span></div>
        <a href="/logout" style="color: #ff3333; text-decoration: none; font-weight: bold;">Logout</a>
    </div>
</div>

<div class="admin-deck" id="admin-controls">
    <h4 style="margin:0 0 10px 0; color:#ff3333;">🛡️ System Operator Controls</h4>
    <div style="display: flex; gap: 10px;">
        <button class="btn-green" onclick="sendSimToggle(true)">Start Simulation Rounds</button>
        <button class="btn-orange" onclick="sendSimToggle(false)">Halt Simulation Rounds</button>
    </div>
</div>

<div class="layout-grid">
    <!-- WAGERS & FIXTURES -->
    <div>
        <div class="card aviator-box">
            <span style="color:#ff3333; font-size:11px; font-weight:bold;" id="av-phase">LOADING</span>
            <div class="mult-display" id="av-mult">1.00x</div>
            <input type="number" id="av-stake-input" value="50" min="10">
            <button class="btn-green" id="btn-av-bet" onclick="fireAviatorBet()">Place Wager</button>
            <button class="btn-orange" id="btn-av-cash" onclick="fireAviatorCashout()" style="display:none;">Cash Out</button>
        </div>

        <div class="card">
            <h3>⚽ Live Simultaneous Fixtures (<span id="round-lbl">Round 1</span>)</h3>
            <div class="scroll-window" id="live-matches"></div>
        </div>
    </div>

    <!-- LEAGUE MATRIX INSTANCES -->
    <div>
        <div class="card">
            <h3 style="color:#00ccff;">🇮🇹 Italian Serie A Standings</h3>
            <div style="max-height: 200px; overflow-y:auto;">
                <table>
                    <thead><tr><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PTS</th></tr></thead>
                    <tbody id="ita-tbody"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h3 style="color:#ffcc00;">🏴󠁧󠁢󠁥󠁮󠁧󠁿 English Premier League Standings</h3>
            <div style="max-height: 200px; overflow-y:auto;">
                <table>
                    <thead><tr><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>PTS</th></tr></thead>
                    <tbody id="eng-tbody"></tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <h3>📜 Matchday Events Ledger</h3>
            <div id="logs-box" style="height:80px; overflow-y:auto; font-family:monospace; font-size:11px; color:#88a0b0; line-height:1.4;"></div>
        </div>
    </div>

    <!-- BANKING STATION -->
    <div>
        <div class="card">
            <h3>💳 Safe Banking Terminal</h3>
            <form action="/deposit" method="POST" style="margin-bottom: 15px;">
                <input type="number" name="amount" min="10" placeholder="Deposit (Min 10 KSH)" required>
                <button type="submit" class="btn-blue">Execute Deposit</button>
            </form>
            <form action="/withdraw" method="POST">
                <input type="number" name="amount" min="100" placeholder="Withdraw (Min 100 KSH)" required>
                <button type="submit" class="btn-orange">Execute Withdrawal</button>
            </form>
        </div>
    </div>
</div>

<script>
    let dynamicWagerPlaced = false;

    setInterval(() => {
        fetch('/api/state')
        .then(r => r.json())
        .then(data => {
            document.getElementById('user-bal').innerText = data.user_balance.toFixed(2);
            document.getElementById('round-lbl').innerText = 'ROUND ' + data.current_round;
            
            // Dynamic Security Checks
            if(data.user_role === 'admin') {
                document.getElementById('admin-controls').style.display = 'block';
                document.getElementById('admin-vault-display').style.display = 'block';
                document.getElementById('house-bal').innerText = data.house_balance.toFixed(2);
            } else {
                document.getElementById('admin-controls').style.display = 'none';
                document.getElementById('admin-vault-display').style.display = 'none';
            }

            if(data.user_bonus_locked) {
                document.getElementById('bonus-box').innerHTML = `(<span style="color:#ff3333; font-size:11px;">Locked: ${data.user_bonus} KSH</span>)`;
            } else {
                document.getElementById('bonus-box').innerHTML = '';
            }

            // Aviator Render State Switch
            document.getElementById('av-mult').innerText = data.aviator.multiplier.toFixed(2) + 'x';
            document.getElementById('av-phase').innerText = data.aviator.phase + ' TIMELINE';

            if(data.aviator.phase === 'BETTING') {
                dynamicWagerPlaced = false;
                document.getElementById('btn-av-bet').style.display = 'block';
                document.getElementById('btn-av-bet').disabled = false;
                document.getElementById('btn-av-cash').style.display = 'none';
            } else if(data.aviator.phase === 'FLYING' && dynamicWagerPlaced) {
                document.getElementById('btn-av-bet').style.display = 'none';
                document.getElementById('btn-av-cash').style.display = 'block';
            } else {
                if(!dynamicWagerPlaced) {
                    document.getElementById('btn-av-bet').style.display = 'block';
                    document.getElementById('btn-av-bet').disabled = true;
                    document.getElementById('btn-av-cash').style.display = 'none';
                }
            }

            // Render Fixtures Lookups
            let htmlFix = '';
            data.live_matches.forEach(m => {
                let border = m.league === 'ITALIAN' ? '#00ccff' : '#ffcc00';
                let timeText = m.minute >= 90 ? '<span style="color:#ff3333;font-weight:bold;">FT</span>' : `Min ${m.minute}'`;
                htmlFix += `
                    <div class="match-row" style="border-left: 3px solid ${border}">
                        <div><span style="font-size:9px; color:${border}; font-weight:bold;">${m.league}</span><br><strong>${m.teams}</strong></div>
                        <div style="text-align:right;"><span class="score-badge">${m.score}</span><br><span style="font-size:11px;">${timeText}</span></div>
                    </div>`;
            });
            document.getElementById('live-matches').innerHTML = htmlFix;

            // Render Standings Grid Matrices
            buildTableRows(data.standings_italian, 'ita-tbody', '#00ccff');
            buildTableRows(data.standings_english, 'eng-tbody', '#ffcc00');

            if(data.match_logs.length > 0) {
                document.getElementById('logs-box').innerHTML = data.match_logs.slice().reverse().join('<br>');
            }
        });
    }, 600);

    function buildTableRows(standingsMap, containerId, accentColor) {
        let sorted = Object.keys(standingsMap).map(name => ({name, ...standingsMap[name]})).sort((a,b) => b.points - a.points);
        let rowsHtml = '';
        sorted.forEach(t => {
            rowsHtml += `<tr><td><strong>${t.name}</strong></td><td>${t.played}</td><td>${t.won}</td><td>${t.draw}</td><td>${t.lost}</td><td style="color:${accentColor}; font-weight:bold;">${t.points}</td></tr>`;
        });
        document.getElementById(containerId).innerHTML = rowsHtml;
    }

    function fireAviatorBet() {
        const val = document.getElementById('av-stake-input').value;
        fetch('/api/aviator/bet', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ stake: parseFloat(val) })
        })
        .then(r => r.json())
        .then(d => {
            if(d.success) {
                dynamicWagerPlaced = true;
                alert("Wager logged successfully!");
            } else {
                alert("Insufficient funds or window closed.");
            }
        });
    }

    function fireAviatorCashout() {
        fetch('/api/aviator/cashout', { method: 'POST' })
        .then(r => r.json())
        .then(d => {
            if(d.success) {
                dynamicWagerPlaced = false;
                alert(`Casouht Successful! Won: ${d.winnings.toFixed(2)} KSH`);
            } else {
                alert("Crash sequence completed already!");
            }
        });
    }

    function sendSimToggle(flag) {
        fetch('/admin/toggle', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ run: flag })
        })
        .then(r => r.json());
    }
</script>
</body>
</html>
