<script>
    // This updates the numbers smoothly without flashing the page
    setInterval(function() {
        fetch('/api/state')
            .then(response => response.json())
            .then(data => {
                // Update the phase text
                document.querySelector('.card:nth-child(2) p:nth-of-type(1)').innerHTML = 'Current Engine State: <strong style="color: #ffcc00;">' + data.phase + ' PHASE</strong>';
                
                // Update the timer numbers smoothly
                document.querySelector('.timer').innerText = data.time + 's';
                
                // Update the round sequence
                document.querySelector('.card:nth-child(2) p:nth-of-type(3) strong').innerText = 'Round #' + data.round;
            })
            .catch(err => console.log("Error fetching live time updates: ", err));
    }, 1000); // Checks for the new second quietly in the background
</script>
